# Start/Help Commands
help_text: |
  **🎛 ArchVcFight**

  **ভিসি / কল**
  `/join <chat_id>` — রেকর্ড ভিসিতে যোগ দিন
  `/leave` — রেকর্ড ভিসি ছেড়ে যান
  `/add <chat_id>` — প্লে টার্গেট যোগ করুন
  `/remove <chat_id>` — প্লে টার্গেট সরান
  `/mute <chat_id>` — ভিসি আউটপুট মিউট করুন
  `/unmute <chat_id>` — ভিসি আউটপুট আনমিউট করুন
  `/vcstatus` — কল অবস্থা দেখান

  **প্লেব্যাক**
  `/play <url|reply>` — প্লে বা কিউ করুন
  `/pause /resume /stop /skip`
  `/seek <sec>` `/progress` `/queue`
  `/shuffle /clearqueue /loop`

  **ইফেক্টস**
  `/volume <0-200>` `/bass <0-30>`
  `/treble <0-30>` `/pitch <-12..12>`
  `/effects /resetfx`

  **প্যানেল**
  `/panel` — ইনলাইন কন্ট্রোল প্যানেল

  **রেকর্ডিং**
  `/recstart [chat_id]` `/recstop [chat_id]` `/reclist`

  **শিডিউলার**
  `/splay <chat_id> <HH:MM> <url>`
  `/smsg <chat_id> <HH:MM> <text>`
  `/slist /scancel <id>`

  **অ্যাডমিন**
  `/kick /ban /unban /gmute /gunmute`
  `/warn /warnings /announce`
  `/chatinfo /userinfo`

  **স্ট্যাট**
  `/stats /chatstats [chat_id] /resetstats`
