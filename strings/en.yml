# Start/Help Commands
help_text: |
  **🎛 ArchVcFight**

  **VC / Call**
  `/join <chat_id>` — join record VC
  `/leave` — leave record VC
  `/add <chat_id>` — add play target
  `/remove <chat_id>` — remove play target
  `/mute <chat_id>` — mute VC output
  `/unmute <chat_id>` — unmute VC output
  `/vcstatus` — show call state

  **Playback**
  `/play <url|reply>` — play or queue
  `/pause /resume /stop /skip`
  `/seek <sec>` `/progress` `/queue`
  `/shuffle /clearqueue /loop`

  **Effects**
  `/volume <0-200>` `/bass <0-30>`
  `/treble <0-30>` `/pitch <-12..12>`
  `/effects /resetfx`

  **Panel**
  `/panel` — inline control panel

  **Recording**
  `/recstart [chat_id]` `/recstop [chat_id]` `/reclist`

  **Scheduler**
  `/splay <chat_id> <HH:MM> <url>`
  `/smsg <chat_id> <HH:MM> <text>`
  `/slist /scancel <id>`

  **Admin**
  `/kick /ban /unban /gmute /gunmute`
  `/warn /warnings /announce`
  `/chatinfo /userinfo`

  **Stats**
  `/stats /chatstats [chat_id] /resetstats`
