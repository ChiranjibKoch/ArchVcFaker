# Start/Help Commands
help_text: |
  **🎛 ArchVcFight**

  **वीसी / कॉल**
  `/join <chat_id>` — रिकॉर्ड वीसी में शामिल हों
  `/leave` — रिकॉर्ड वीसी छोड़ें
  `/add <chat_id>` — प्ले टार्गेट जोड़ें
  `/remove <chat_id>` — प्ले टार्गेट हटाएं
  `/mute <chat_id>` — वीसी आउटपुट म्यूट करें
  `/unmute <chat_id>` — वीसी आउटपुट अनम्यूट करें
  `/vcstatus` — कॉल स्थिति दिखाएं

  **प्लेबैक**
  `/play <url|reply>` — चलाएं या कतार में जोड़ें
  `/pause /resume /stop /skip`
  `/seek <sec>` `/progress` `/queue`
  `/shuffle /clearqueue /loop`

  **प्रभाव**
  `/volume <0-200>` `/bass <0-30>`
  `/treble <0-30>` `/pitch <-12..12>`
  `/effects /resetfx`

  **पैनल**
  `/panel` — इनलाइन कंट्रोल पैनल

  **रिकॉर्डिंग**
  `/recstart [chat_id]` `/recstop [chat_id]` `/reclist`

  **शेड्यूलर**
  `/splay <chat_id> <HH:MM> <url>`
  `/smsg <chat_id> <HH:MM> <text>`
  `/slist /scancel <id>`

  **एडमिन**
  `/kick /ban /unban /gmute /gunmute`
  `/warn /warnings /announce`
  `/chatinfo /userinfo`

  **आंकड़े**
  `/stats /chatstats [chat_id] /resetstats`
